<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="theme-color" content="#f5f1e8">
    <meta
      name="description"
      content="Um jogo da forca simples e divertido para jogar no navegador."
    >
    <title>Jogo da Forca</title>
    <link rel="stylesheet" href="style.css">
    <script src="config.js"></script>
    <script type="module" src="script.js"></script>
  </head>
  <body>
    <main class="game">
      <header class="game__header">
        <p class="eyebrow">JOGO CLÁSSICO</p>
        <h1>Jogo da <span>Forca</span></h1>
        <p class="intro">Jogue sozinho ou desafie outra pessoa online.</p>
      </header>

      <section class="mode-panel" aria-label="Modo de jogo">
        <div class="mode-switch">
          <button class="mode-button is-active" id="solo-mode" type="button" aria-pressed="true">
            Solo
          </button>
          <button class="mode-button" id="multiplayer-mode" type="button" aria-pressed="false">
            Multiplayer online
          </button>
        </div>
        <div class="online-controls" id="online-controls" hidden>
          <label class="field">
            <span>Seu nome</span>
            <input id="player-name" type="text" maxlength="24" autocomplete="nickname" placeholder="Como quer ser chamado?">
          </label>
          <div class="room-actions">
            <button class="new-game" id="create-room" type="button">Criar sala</button>
            <label class="field room-field">
              <span>Código da sala</span>
              <input id="room-code" type="text" maxlength="6" autocomplete="off" placeholder="ABC123">
            </label>
            <button class="join-room" id="join-room" type="button">Entrar</button>
          </div>
          <p class="online-status" id="online-status" aria-live="polite">
            Crie uma sala e compartilhe o código com outra pessoa.
          </p>
        </div>
      </section>

      <section class="game__panel" aria-label="Partida de forca">
        <div class="game__topline">
          <p class="category">Categoria: <strong id="category">—</strong></p>
          <p class="lives">Erros: <strong id="mistakes">0</strong><span> / 6</span></p>
        </div>

        <div class="play-area">
          <div class="drawing" aria-hidden="true">
            <svg viewBox="0 0 220 230" role="img">
              <path class="gallows" d="M25 210h170M65 210V25h105v25" />
              <circle class="person" id="part-head" cx="170" cy="72" r="20" />
              <path class="person" id="part-body" d="M170 92v55" />
              <path class="person" id="part-left-arm" d="m170 108-28 24" />
              <path class="person" id="part-right-arm" d="m170 108 28 24" />
              <path class="person" id="part-left-leg" d="m170 147-25 34" />
              <path class="person" id="part-right-leg" d="m170 147 25 34" />
            </svg>
          </div>

          <div class="word-area">
            <p class="hint-label">A palavra é</p>
            <p class="word" id="word" aria-label="Palavra para adivinhar"></p>
            <p class="message" id="message" aria-live="polite">
              Escolha uma letra para começar.
            </p>
          </div>
        </div>

        <div class="keyboard" id="keyboard" aria-label="Letras para escolher"></div>

        <div class="game__footer">
          <p class="keyboard-help">Dica: você também pode usar o teclado.</p>
          <button class="new-game" id="new-game" type="button">Nova palavra</button>
        </div>
      </section>
      <footer class="page-footer">Feito para aprender e se divertir ✦</footer>
    </main>
  </body>
</html>
